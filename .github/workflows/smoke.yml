name: Smoke Tests

on:
  push:
    branches: [main, develop, 'feature/**', 'bugfix/**']
  pull_request:
    branches: [main, develop]

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Security audit
        run: npm audit --audit-level=high
        # continue-on-error: known high vulns in @imgly/background-removal-node (lodash/zod)
        # locked until upstream releases a fix — remove once resolved
        continue-on-error: true

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build frontend
        run: npm run build

      - name: Run smoke tests
        run: npm run test:smoke
